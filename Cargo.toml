# Workspace root.
#
# Without this, `cargo build --workspace` — which README.md and the docs assume
# — has no manifest to resolve, and each crate had to be built from its own
# directory. Both crates keep their own [package] sections; this only groups
# them and gives them a shared target/ and lockfile.
#
# The split itself is deliberate and is documented in ARCHITECTURE.md:
# crates/corelens-probe has no Tauri dependency, so the security-critical
# code (target parsing, argv construction, threshold logic, cancellation)
# builds and tests with plain `cargo test` and none of the GTK/WebKit stack.

[workspace]
resolver = "2"
# The patched third-party crate is a dependency, not a member.
exclude = ["vendor/textfsm-rs"]
members = [
    "crates/corelens-probe",
    "crates/corelens-discover",
    "crates/corelens-meraki",
    "crates/corelens-formats",
    "crates/corelens-catalog",
    "crates/corelens-collect",
    "crates/corelens-topology",
    "crates/corelens-path",
    "src-tauri",
]

# Applies to the whole workspace, so a release build of either crate is
# optimised the same way. Mirrors what src-tauri already declared.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Textfsm-rs with two fixes that make it match Python TextFSM on the
# whole ntc-templates suite; vendor/textfsm-rs/CORELENS-PATCHES.md says what
# and why. Removed when a release carries them.
[patch.crates-io]
textfsm-rs = { path = "vendor/textfsm-rs" }
